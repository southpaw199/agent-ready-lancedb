# Runs the LanceDB examples notebook from a clean install on every change,
# so the setup instructions and every code cell are proven to work.
name: LanceDB examples

on:
  push:
    branches: [main]
    paths:
      - "case-studies/lancedb/examples/**"
      - ".github/workflows/lancedb-examples.yml"
  pull_request:
    paths:
      - "case-studies/lancedb/examples/**"
      - ".github/workflows/lancedb-examples.yml"
  workflow_dispatch:

# The job only checks out code and uploads an artifact, so the token
# needs nothing beyond read access to the repo.
permissions:
  contents: read

jobs:
  run-notebook:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: case-studies/lancedb/examples

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: case-studies/lancedb/examples/requirements.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('case-studies/lancedb/examples/docs-search.ipynb') }}
          restore-keys: hf-models-

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check the install
        run: python -c "import lancedb, sentence_transformers; print('lancedb', lancedb.__version__)"

      - name: Run the notebook
        run: |
          jupyter nbconvert --to notebook --execute docs-search.ipynb \
            --output executed-docs-search.ipynb \
            --ExecutePreprocessor.timeout=1200

      - name: Save the executed notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebook
          path: case-studies/lancedb/examples/executed-docs-search.ipynb
          if-no-files-found: ignore
